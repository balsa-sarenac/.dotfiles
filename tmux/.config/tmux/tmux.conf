# Prefix
unbind-key C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window

# Terminal
set  -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Behaviour
set -g mouse on
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g display-time 2000
set -g set-clipboard on
setw -g mode-keys vi

# Panes
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind '"' split-window -v -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind  c  new-window      -c "#{pane_current_path}"

# Copy mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel

# Sessions
bind-key f   display-popup -E -w 70% -h 60% "~/.local/scripts/tmux-sessionizer"
bind-key C-f choose-tree -Zs

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Modus Themes for Tmux
# Auto generated with https://github.com/miikanissi/modus-themes.nvim/blob/master/lua/modus-themes/extras/tmux.lua
set-option -g status-position "bottom"
set-option -g status-style bg=#c8c8c8,fg=#0a0a0a
set-option -g status-left '#[bg=#c8c8c8,fg=#0a0a0a,bold]#{?client_prefix,,  tmux  }#[bg=#3548cf,fg=#f2f2f2,bold]#{?client_prefix,  tmux  ,}'
set-option -g status-right '%H:%M %d-%m-%Y #S '
set-option -g window-status-format ' #I:#W '
set-option -g window-status-current-format '#[bg=#3549cf,fg=#f2f2f2] #I:#W#{?window_zoomed_flag,  , }'

# Plugins live outside the stow package, they are machine state
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'nvim vim htop less man'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run "$HOME/.local/share/tmux/plugins/tpm/tpm"
