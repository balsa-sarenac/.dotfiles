# Send prefix
unbind-key C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key l select-pane -R
bind-key k select-pane -U
bind-key j select-pane -D

# Mouse mode
set -g mouse on
set -g focus-events on

# Easy config reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded."

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Compatibility for colors
# True color settings
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

# Plugins are machine state, keep them out of the stow package
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Modus Themes for Tmux 
# Auto generated with https://github.com/miikanissi/modus-themes.nvim/blob/master/lua/modus-themes/extras/tmux.lua

set-option -g status-position "bottom"
set-option -g status-style bg=#c8c8c8,fg=#0a0a0a
set-option -g status-left '#[bg=#c8c8c8,fg=#0a0a0a,bold]#{?client_prefix,,  tmux  }#[bg=#3548cf,fg=#f2f2f2,bold]#{?client_prefix,  tmux  ,}'
set-option -g status-right '%H:%M %d-%m-%Y #S '
set-option -g window-status-format ' #I:#W '
set-option -g window-status-current-format '#[bg=#3549cf,fg=#f2f2f2] #I:#W#{?window_zoomed_flag,  , }'

run "$HOME/.local/share/tmux/plugins/tpm/tpm"
